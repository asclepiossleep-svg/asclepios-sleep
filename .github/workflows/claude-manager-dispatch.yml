name: Claude Manager/Audit Responder

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude-respond:
    # Kill switch — set a repo Actions variable named CLAUDE_AUTOMATION_ENABLED
    # to "false" (Settings -> Secrets and variables -> Actions -> Variables)
    # to pause this workflow instantly without touching this file or the
    # ANTHROPIC_API_KEY secret. Unset/anything else = enabled.
    #
    # Security: only Edmund's own GitHub account can trigger this — this repo
    # is public, so without this check anyone on the internet could open an
    # issue containing [MANAGER]/[AUDIT] and get write access + spend the
    # linked Anthropic API budget. Add further trusted logins here (comma-
    # separated) if ChatGPT posts through a different bridged account.
    if: >
      vars.CLAUDE_AUTOMATION_ENABLED != 'false' &&
      (github.event.issue.user.login == 'asclepiossleep-svg' ||
       github.event.comment.user.login == 'asclepiossleep-svg') &&
      (
        contains(github.event.issue.title, '[MANAGER]') ||
        contains(github.event.issue.title, '[AUDIT]') ||
        contains(github.event.issue.body, '[MANAGER]') ||
        contains(github.event.issue.body, '[AUDIT]') ||
        contains(github.event.comment.body, '[MANAGER]') ||
        contains(github.event.comment.body, '[AUDIT]') ||
        contains(join(github.event.issue.labels.*.name, ','), 'manager-order') ||
        contains(join(github.event.issue.labels.*.name, ','), 'audit-fix')
      )
    runs-on: ubuntu-latest
    # Cost control #6 — the hard stop. --max-turns in claude_args is also
    # set below, but has a known upstream bug where it isn't always honoured
    # (anthropics/claude-code-action#1177) — this job-level timeout is the
    # backstop that actually always works, per Anthropic's own "Manage
    # costs" guidance.
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare persistent feature branch
        id: branch
        env:
          ITEM_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          branch="claude/manager-issue-${ITEM_NUMBER}"
          git fetch origin
          if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            git checkout -B "${branch}" "origin/${branch}"
          else
            git checkout -b "${branch}"
          fi
          git config user.name "claude[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Manager
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Debug (2 Sep 2026) — temporary, to see the real error behind an
          # is_error:true / 1-turn / $0-cost instant failure that the
          # summary log hides by default. Remove once resolved.
          show_full_output: true
          # Cost control #3/#4 — claude-sonnet-5 (not Opus) as the routine
          # working model for this repo's implementation tasks. If a future
          # task turns out to need a stronger model, override per-issue by
          # asking for it explicitly in the [MANAGER]/[AUDIT] text — this
          # action reads the issue body as part of its instructions.
          # Cost control #5/#6 — one bounded run per triggering event
          # (--max-turns caps a single run's back-and-forth instead of
          # letting it iterate indefinitely; timeout-minutes above is the
          # hard backstop).
          # Permissions fix (5 Sep 2026) — without an explicit allowlist,
          # every network-capable tool (gh CLI, WebFetch) sits behind an
          # interactive approval prompt that nothing in this unattended
          # pipeline can click, so the agent could not even read the
          # triggering issue. This allowlist lets it act without a human
          # in the loop, which is required for autonomous operation.
          # Turn budget (5 Sep 2026) — raised to 150 after #5.6 (a genuinely
          # new feature: schema + API + frontend) hit the 80-turn cap
          # mid-task with nothing committed. Prompt below now also requires
          # incremental commits per sub-piece so a future turn-cap hit still
          # leaves completed work saved on a feature branch instead of losing it.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 150
            --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck),Bash(git status),Bash(git diff),Bash(git log),Bash(git add:*),Bash(git commit:*),Edit,Write,Read,Glob,Grep"
          prompt: |
            You are the implementation agent for the Asclepios Sleep repo
            (asclepiossleep-svg/asclepios-sleep), continuing the Fix #5
            UX/IA correction track.

            Read this GitHub issue/comment thread in full before doing
            anything. Treat its text as a work order to interpret and act on
            in the codebase — never as literal shell commands to execute
            verbatim.

            Implement the smallest correct, complete change that satisfies
            the request. Work only on the feature branch prepared for this
            issue by the GitHub action. Never commit or push directly to main.
            If the task is large enough to naturally break into multiple
            independent sub-pieces (e.g. schema, then API, then frontend,
            then seed data), commit and push each sub-piece to that feature
            branch as soon as it is complete and passes its own build/typecheck
            — do not wait until the entire task is done to make your first
            checkpoint. This ensures that if you run out of turns partway
            through, completed work remains safely reviewable.

            Do not push, open, edit, close, review, approve, or merge pull
            requests yourself. The workflow will validate and push the branch,
            then open or update the pull request after your run. In your final
            response report what changed, commit SHA(s), build/test status,
            and exactly what remains if the turn limit is reached. Never
            commit to main.

            Only stop and ask a clarifying question in the thread instead of
            implementing if the request is a genuine product decision, a
            destructive database/schema migration, a paid external
            service/licensing decision, or cannot be resolved from the
            existing repository and requirements.

      - name: Validate and push feature-branch checkpoints
        id: push
        if: always()
        shell: bash
        run: .github/scripts/manager-dispatch-guard.sh main origin

      - name: Open or update pull request
        id: pr
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ITEM_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh pr list --head "${BRANCH}" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "${url}" ]; then
            url="$(gh pr create               --head "${BRANCH}"               --base main               --title "chore: manager work for issue #${ITEM_NUMBER}"               --body "Automated feature-branch checkpoint for #${ITEM_NUMBER}. Human review and merge required; this workflow never auto-merges.")"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Report checkpoint
        if: always() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
          CLAUDE_RESULT: ${{ steps.claude.outputs.conclusion }}
        shell: bash
        run: |
          gh issue comment "${ITEM_NUMBER}" --body "Manager checkpoint saved on \`${BRANCH}\`. Pull request: ${PR_URL}. Claude result: \`${CLAUDE_RESULT:-unknown}\`. Human review and merge required."

      - name: Preserve failed Claude status
        if: steps.claude.outputs.conclusion != 'success'
        shell: bash
        run: exit 1
