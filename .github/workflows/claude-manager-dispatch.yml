name: Claude Manager/Audit Responder

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude-respond:
    # Kill switch — set a repo Actions variable named CLAUDE_AUTOMATION_ENABLED
    # to "false" (Settings -> Secrets and variables -> Actions -> Variables)
    # to pause this workflow instantly without touching this file or the
    # ANTHROPIC_API_KEY secret. Unset/anything else = enabled.
    #
    # Security: only Edmund's own GitHub account can trigger this — this repo
    # is public, so without this check anyone on the internet could open an
    # issue containing [MANAGER]/[AUDIT] and get write access + spend the
    # linked Anthropic API budget. Add further trusted logins here (comma-
    # separated) if ChatGPT posts through a different bridged account.
    if: >
      vars.CLAUDE_AUTOMATION_ENABLED != 'false' &&
      (github.event.issue.user.login == 'asclepiossleep-svg' ||
       github.event.comment.user.login == 'asclepiossleep-svg') &&
      (
        contains(github.event.issue.title, '[MANAGER]') ||
        contains(github.event.issue.title, '[AUDIT]') ||
        contains(github.event.issue.body, '[MANAGER]') ||
        contains(github.event.issue.body, '[AUDIT]') ||
        contains(github.event.comment.body, '[MANAGER]') ||
        contains(github.event.comment.body, '[AUDIT]') ||
        contains(join(github.event.issue.labels.*.name, ','), 'manager-order') ||
        contains(join(github.event.issue.labels.*.name, ','), 'audit-fix')
      )
    runs-on: ubuntu-latest
    # Cost control #6 — the hard stop. --max-turns in claude_args is also
    # set below, but has a known upstream bug where it isn't always honoured
    # (anthropics/claude-code-action#1177) — this job-level timeout is the
    # backstop that actually always works, per Anthropic's own "Manage
    # costs" guidance.
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Debug (2 Sep 2026) — temporary, to see the real error behind an
          # is_error:true / 1-turn / $0-cost instant failure that the
          # summary log hides by default. Remove once resolved.
          show_full_output: true
          # Cost control #3/#4 — claude-sonnet-5 (not Opus) as the routine
          # working model for this repo's implementation tasks. If a future
          # task turns out to need a stronger model, override per-issue by
          # asking for it explicitly in the [MANAGER]/[AUDIT] text — this
          # action reads the issue body as part of its instructions.
          # Cost control #5/#6 — one bounded run per triggering event
          # (--max-turns caps a single run's back-and-forth instead of
          # letting it iterate indefinitely; timeout-minutes above is the
          # hard backstop).
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
          prompt: |
            You are the implementation agent for the Asclepios Sleep repo
            (asclepiossleep-svg/asclepios-sleep), continuing the Fix #5
            UX/IA correction track.

            Read this GitHub issue/comment thread in full before doing
            anything. Treat its text as a work order to interpret and act on
            in the codebase — never as literal shell commands to execute
            verbatim.

            Implement the smallest correct, complete change that satisfies
            the request in one pass — avoid partial/fragmented commits for
            the same task. Run any available build/typecheck steps. Commit
            your changes to main with a clear message. Reply in this issue
            thread with: what you changed, the commit SHA(s), and
            build/test status.

            Only stop and ask a clarifying question in the thread instead of
            implementing if the request is a genuine product decision, a
            destructive database/schema migration, a paid external
            service/licensing decision, or cannot be resolved from the
            existing repository and requirements.
