name: required-build-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-build-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: required-build-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Enforce immutable workflow action pins
        run: node scripts/ci/check-workflow-pins.mjs

      - name: Enforce deterministic agent workflow security policy
        run: node scripts/verify-agent-workflow-policy.mjs

      - name: Run Health convergence preflight before build
        run: node scripts/ci/health-convergence-preflight.mjs

      - name: Upload convergence report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-build-health-convergence-${{ github.run_id }}
          path: artifacts/health-convergence-preflight.json
          if-no-files-found: error
          retention-days: 14

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Build monorepo
        run: npm run build
