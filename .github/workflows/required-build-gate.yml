name: required-build-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-build-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: required-build-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Enforce immutable workflow action pins
        run: node scripts/ci/check-workflow-pins.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build monorepo
        run: npm run build
