name: policy-gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: policy-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enforce hardened workflow policy
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t hardened < <(find .github/workflows -maxdepth 1 -type f -name '*-gate.yml' -print | sort)

          if [[ ${#hardened[@]} -eq 0 ]]; then
            echo '::error::No hardened gate workflows found'
            exit 1
          fi

          failed=0

          for file in "${hardened[@]}"; do
            echo "Checking $file"

            if ! grep -Eq '^permissions:' "$file"; then
              echo "::error file=$file::Hardened workflows must declare explicit permissions"
              failed=1
            fi

            if grep -Eq '^[[:space:]]*permissions:[[:space:]]*write-all([[:space:]]|$)' "$file"; then
              echo "::error file=$file::write-all is forbidden"
              failed=1
            fi

            if grep -Eq '^[[:space:]]*pull_request_target:' "$file"; then
              echo "::error file=$file::pull_request_target is forbidden for hardened PR gates"
              failed=1
            fi

            if ! grep -Eq '^concurrency:' "$file"; then
              echo "::error file=$file::Hardened workflows must declare workflow-level concurrency"
              failed=1
            fi

            if ! grep -Eq '^[[:space:]]*cancel-in-progress:[[:space:]]*true([[:space:]]|$)' "$file"; then
              echo "::error file=$file::Hardened workflows must cancel superseded in-progress runs"
              failed=1
            fi

            if ! grep -Eq '^[[:space:]]*timeout-minutes:[[:space:]]*[1-9][0-9]*([[:space:]]|$)' "$file"; then
              echo "::error file=$file::Every hardened workflow must bound job runtime with timeout-minutes"
              failed=1
            fi

            while IFS= read -r line; do
              ref="${line#*@}"
              if [[ "$line" == *'uses: ./'* ]]; then
                continue
              fi
              if [[ ! "$ref" =~ ^[0-9a-f]{40}[[:space:]]*$ ]]; then
                echo "::error file=$file::External actions must be pinned to a full 40-character commit SHA: $line"
                failed=1
              fi
            done < <(grep -E '^[[:space:]]*uses:[[:space:]]*[^[:space:]]+@' "$file" || true)
          done

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo 'Policy gate passed: hardened workflows use explicit least-privilege permissions, safe PR triggers, bounded runtimes, superseded-run cancellation, and immutable action references.'
