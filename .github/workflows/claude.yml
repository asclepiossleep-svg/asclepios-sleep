# Interactive @claude responder for issues and pull requests.
#
# Carried forward from branch codex/ai-collaboration-setup. Coexists with
# claude-manager-dispatch.yml — triggers are disjoint by convention:
#   - this file responds only to an explicit "@claude" mention (or an issue
#     assigned to the bot);
#   - claude-manager-dispatch.yml responds only to "[MANAGER]" / "[AUDIT]".
# Keep them disjoint. See docs/ai/AI_COLLABORATION.md.
#
# Changes from the source branch:
#   - actions/checkout@v6 -> @v4 (v6 does not exist);
#   - added the `vars.CLAUDE_AUTOMATION_ENABLED != 'false'` guard so the
#     repo's existing kill switch (see claude-manager-dispatch.yml) also
#     pauses this workflow;
#   - added `Bash(gh pr create:*)` plus read-only `Bash(gh pr view:*)` and
#     `Bash(gh pr checks:*)` to --allowedTools so Claude can open the pull
#     request itself and report its URL + check results. It still cannot
#     merge, close, edit, review/approve a PR, delete branches, or run
#     `gh api` / arbitrary shell — those have no allow rule and are denied
#     (this workflow does not use --dangerously-skip-permissions).
# Every other line is preserved as authored.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    if: >-
      vars.CLAUDE_AUTOMATION_ENABLED != 'false' &&
      (github.actor == github.repository_owner || github.actor == 'github-actions[bot]') &&
      (contains(github.event.comment.body || '', '@claude') ||
      contains(github.event.review.body || '', '@claude') ||
      contains(github.event.issue.body || '', '@claude') ||
      github.event.action == 'assigned')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          track_progress: "true"
          use_sticky_comment: "true"
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 12
            --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck),Bash(git status),Bash(git diff),Bash(git log),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*),Edit,Write,Read,Glob,Grep"

      - name: Classify Claude result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -u
          if [ -z "${ITEM_NUMBER}" ]; then
            exit 0
          fi

          ensure_label() {
            local label="$1"
            local colour="$2"
            gh api --method POST "repos/${REPOSITORY}/labels" \
              -f name="$label" -f color="$colour" >/dev/null 2>&1 || true
          }

          remove_label() {
            local encoded="$1"
            gh api --method DELETE "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/labels/${encoded}" \
              >/dev/null 2>&1 || true
          }

          ensure_label "ai:paused-quota" "d4a72c"
          ensure_label "ai:blocked" "b60205"

          if [ "${CONCLUSION}" = "success" ]; then
            remove_label "ai%3Apaused-quota"
            remove_label "ai%3Ablocked"
            exit 0
          fi

          summary=""
          if [ -n "${EXECUTION_FILE}" ] && [ -f "${EXECUTION_FILE}" ]; then
            summary=$(tr '\n' ' ' < "${EXECUTION_FILE}" | tail -c 12000)
          fi

          if printf '%s' "${summary}" | grep -Eiq \
            'usage limit|rate.?limit|quota|credit balance|resets? at|too many requests|429'; then
            remove_label "ai%3Ablocked"
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/labels" \
              --input - <<'JSON'
          {"labels":["ai:paused-quota"]}
          JSON
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/comments" \
              -f body="[AI-STATUS] PAUSED-QUOTA — Claude stopped because usage is temporarily unavailable. The hourly retry workflow will continue from the latest commit/checkpoint. [Workflow run](${RUN_URL})"
          else
            remove_label "ai%3Apaused-quota"
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/labels" \
              --input - <<'JSON'
          {"labels":["ai:blocked"]}
          JSON
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/comments" \
              -f body="[AI-STATUS] BLOCKED — Claude failed for a reason not safely classified as a usage limit. Codex should inspect the workflow log before retrying. [Workflow run](${RUN_URL})"
          fi

      - name: Preserve failed status
        if: steps.claude.outputs.conclusion != 'success'
        shell: bash
        run: exit 1
