name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    if: >-
      contains(github.event.comment.body || '', '@claude') ||
      contains(github.event.review.body || '', '@claude') ||
      contains(github.event.issue.body || '', '@claude') ||
      github.event.action == 'assigned'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          track_progress: "true"
          use_sticky_comment: "true"
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 12
            --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck),Bash(git status),Bash(git diff),Bash(git log),Edit,Write,Read,Glob,Grep"

      - name: Classify Claude result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -u
          if [ -z "${ITEM_NUMBER}" ]; then
            exit 0
          fi

          ensure_label() {
            local label="$1"
            local colour="$2"
            gh api --method POST "repos/${REPOSITORY}/labels" \
              -f name="$label" -f color="$colour" >/dev/null 2>&1 || true
          }

          remove_label() {
            local encoded="$1"
            gh api --method DELETE "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/labels/${encoded}" \
              >/dev/null 2>&1 || true
          }

          ensure_label "ai:paused-quota" "d4a72c"
          ensure_label "ai:blocked" "b60205"

          if [ "${CONCLUSION}" = "success" ]; then
            remove_label "ai%3Apaused-quota"
            remove_label "ai%3Ablocked"
            exit 0
          fi

          summary=""
          if [ -n "${EXECUTION_FILE}" ] && [ -f "${EXECUTION_FILE}" ]; then
            summary=$(tr '\n' ' ' < "${EXECUTION_FILE}" | tail -c 12000)
          fi

          if printf '%s' "${summary}" | grep -Eiq \
            'usage limit|rate.?limit|quota|credit balance|resets? at|too many requests|429'; then
            remove_label "ai%3Ablocked"
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/labels" \
              --input - <<'JSON'
          {"labels":["ai:paused-quota"]}
          JSON
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/comments" \
              -f body="[AI-STATUS] PAUSED-QUOTA — Claude stopped because usage is temporarily unavailable. The hourly retry workflow will continue from the latest commit/checkpoint. [Workflow run](${RUN_URL})"
          else
            remove_label "ai%3Apaused-quota"
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/labels" \
              --input - <<'JSON'
          {"labels":["ai:blocked"]}
          JSON
            gh api --method POST "repos/${REPOSITORY}/issues/${ITEM_NUMBER}/comments" \
              -f body="[AI-STATUS] BLOCKED — Claude failed for a reason not safely classified as a usage limit. Codex should inspect the workflow log before retrying. [Workflow run](${RUN_URL})"
          fi

      - name: Preserve failed status
        if: steps.claude.outputs.conclusion != 'success'
        shell: bash
        run: exit 1

