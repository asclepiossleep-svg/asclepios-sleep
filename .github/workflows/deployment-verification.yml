name: deployment-verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Deployment URL to verify
        required: true
        type: string
      verification_profile:
        description: Route contract to verify
        required: true
        default: auto
        type: choice
        options:
          - auto
          - sleep
          - health

permissions:
  contents: read
  issues: write

env:
  DEPLOYMENT_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
  VERIFY_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_profile || 'auto' }}

jobs:
  verify-deployment:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Verify deployed routes with bounded retries
        run: node scripts/verify-deployment.mjs

      - name: Install pinned Playwright Chromium for production evidence capture
        if: contains(env.DEPLOYMENT_URL, 'health') || env.VERIFY_PROFILE == 'health'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Capture canonical production evidence (Health)
        if: contains(env.DEPLOYMENT_URL, 'health') || env.VERIFY_PROFILE == 'health'
        env:
          CANONICAL_URL: ${{ env.DEPLOYMENT_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set +e
          node scripts/ci/verify-production-evidence.mjs
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::Production evidence capture was blocked by an external provider rate limit, not a verification failure. See the uploaded evidence artifact."
            exit 0
          fi
          exit "$status"

      - name: Upload production evidence artifact
        if: always() && (contains(env.DEPLOYMENT_URL, 'health') || env.VERIFY_PROFILE == 'health')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-evidence-${{ github.run_id }}
          path: artifacts/production-verification/
          if-no-files-found: warn
          retention-days: 30

      - name: Resolve recovered deployment blocker
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title='[AMANDA-BLOCKER] Deployment verification failed'
          existing="$(gh issue list --repo "$REPOSITORY" --state open --search '"[AMANDA-BLOCKER] Deployment verification failed" in:title' --limit 50 --json number,body | jq -r --arg url "$DEPLOYMENT_URL" '.[] | select(.body | contains($url)) | .number' | head -n 1)"

          if [ -n "$existing" ]; then
            printf -v body '%s\n' \
              '[AMANDA-RECOVERY] RECOVERED' \
              '' \
              "VERIFIED URL: ${DEPLOYMENT_URL}" \
              "PROFILE: ${VERIFY_PROFILE}" \
              "REVISION: ${REVISION}" \
              "RUN: ${RUN_URL}" \
              '' \
              'COMPLETION CRITERION: deterministic deployment verification passed.'
            gh issue comment "$existing" --repo "$REPOSITORY" --body "$body"
            gh issue close "$existing" --repo "$REPOSITORY" --reason completed
          fi

      - name: Escalate failed deployment verification
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title='[AMANDA-BLOCKER] Deployment verification failed'
          printf -v body '%s\n' \
            '[AMANDA-RECOVERY] BLOCKED' \
            '' \
            "CAUSE: Deterministic deployment verification failed for ${DEPLOYMENT_URL}." \
            "PROFILE: ${VERIFY_PROFILE}" \
            "REVISION: ${REVISION}" \
            "RUN: ${RUN_URL}" \
            '' \
            'EXACT NEXT ACTION: Open the failed verification run, identify the failing route/check, restore or redeploy the affected app, then rerun deployment verification.'

          existing="$(gh issue list --repo "$REPOSITORY" --state open --search '"[AMANDA-BLOCKER] Deployment verification failed" in:title' --limit 50 --json number,body | jq -r --arg url "$DEPLOYMENT_URL" '.[] | select(.body | contains($url)) | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
          fi
