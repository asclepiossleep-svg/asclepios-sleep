name: visual-regression-gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: visual-regression-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-regression:
    name: visual-regression-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run Health convergence preflight
        id: preflight
        continue-on-error: true
        run: |
          node scripts/ci/health-convergence-preflight.mjs
          node tests/health-visual-manifest-check.mjs

      - name: Record visual skip when internally blocked
        if: steps.preflight.outcome == 'failure'
        run: echo 'HEALTH_VISUAL_SKIPPED: INTERNAL_BLOCKED by health-convergence-preflight; no build/Playwright/visual comparison executed.'

      - name: Install application dependencies from lockfile
        if: steps.preflight.outcome == 'success'
        run: npm ci --no-audit --no-fund

      - name: Build monorepo
        if: steps.preflight.outcome == 'success'
        run: npm run build

      - name: Install pinned Playwright Test and Chromium
        if: steps.preflight.outcome == 'success'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Start built Sleep web preview
        if: steps.preflight.outcome == 'success'
        run: nohup npm run preview --workspace=apps/web -- --host 127.0.0.1 --port 4173 > /tmp/asclepios-vite-preview.log 2>&1 &

      - name: Wait for Sleep preview checkpoint
        if: steps.preflight.outcome == 'success'
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/asclepios-vite-preview.log || true
          exit 1

      - name: Compare Sleep against committed visual baselines
        if: steps.preflight.outcome == 'success'
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test -c playwright.visual.config.mjs

      - name: Start built Health web preview
        if: steps.preflight.outcome == 'success'
        run: nohup npm run preview --workspace=apps/health-web -- --host 127.0.0.1 --port 4174 > /tmp/asclepios-health-vite-preview.log 2>&1 &

      - name: Wait for Health preview checkpoint
        if: steps.preflight.outcome == 'success'
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/asclepios-health-vite-preview.log || true
          exit 1

      - name: Capture and verify Health desktop/mobile visual evidence
        if: steps.preflight.outcome == 'success'
        env:
          HEALTH_BASE_URL: http://127.0.0.1:4174
        run: node tests/health-visual-evidence.mjs

      - name: Upload visual/preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-evidence-${{ github.run_id }}
          path: |
            artifacts/health-convergence-preflight.json
            test-results/
            artifacts/health-visual-evidence/
            /tmp/asclepios-vite-preview.log
            /tmp/asclepios-health-vite-preview.log
          if-no-files-found: warn
          retention-days: 7
