# Hourly retry for Claude work paused by a usage limit.
# Carried forward verbatim from branch codex/ai-collaboration-setup.
# Pairs with the "Classify Claude result" step in claude.yml.
# See docs/ai/AI_COLLABORATION.md.
name: Retry Claude quota-paused work

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-trigger paused Claude tasks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          numbers=$(gh api --method GET "repos/${REPOSITORY}/issues" \
            -f state=open -f labels='ai:paused-quota' -f per_page=10 \
            --jq '.[].number')

          for number in ${numbers}; do
            gh api --method POST "repos/${REPOSITORY}/issues/${number}/comments" \
              -f body='@claude Resume this task from the latest committed checkpoint and GitHub discussion. Do not repeat completed work. Continue until the next coherent checkpoint or READY_FOR_AUDIT.'
            gh api --method DELETE \
              "repos/${REPOSITORY}/issues/${number}/labels/ai%3Apaused-quota" \
              >/dev/null 2>&1 || true
          done
