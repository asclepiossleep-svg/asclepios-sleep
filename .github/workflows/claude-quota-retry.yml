name: Retry Claude quota-paused work

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: claude-quota-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preflight kill switch
        id: preflight
        env:
          AUTOMATION_ENABLED: ${{ vars.CLAUDE_AUTOMATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AUTOMATION_ENABLED:-}" = "false" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Automation kill switch is false."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-trigger paused Claude tasks
        if: steps.preflight.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAX_RETRIES: "6"
        shell: bash
        run: |
          set -euo pipefail
          numbers="$(gh issue list --repo "$REPOSITORY" --state open --label 'ai:paused-quota' --limit 100 --json number --jq '.[].number')"

          for number in $numbers; do
            comments="$(gh api --paginate "repos/${REPOSITORY}/issues/${number}/comments?per_page=100" --jq '.[].body')"
            attempts="$(printf '%s\n' "$comments" | grep -Fc '<!-- claude-quota-retry-attempt:' || true)"

            if [ "$attempts" -ge "$MAX_RETRIES" ]; then
              if ! printf '%s\n' "$comments" | grep -Fq '<!-- claude-quota-retry-exhausted -->'; then
                printf -v body '%s\n' \
                  '<!-- claude-quota-retry-exhausted -->' \
                  '[AMANDA-RECOVERY] BLOCKED' \
                  '' \
                  "CAUSE: Claude quota retry limit reached after ${attempts} automated resume attempts." \
                  'EXACT NEXT ACTION: Review quota/account availability, then remove the exhaustion marker or quota label only when recovery is safe.'
                gh issue comment "$number" --repo "$REPOSITORY" --body "$body"
              fi
              continue
            fi

            next_attempt=$((attempts + 1))
            printf -v body '%s\n' \
              "<!-- claude-quota-retry-attempt:${next_attempt} -->" \
              '@claude Resume this task from the latest committed checkpoint and GitHub discussion. Do not repeat completed work. Continue until the next coherent checkpoint and post the required structured handoff.'
            gh issue comment "$number" --repo "$REPOSITORY" --body "$body"
            gh issue edit "$number" --repo "$REPOSITORY" --remove-label 'ai:paused-quota' >/dev/null 2>&1 || true
          done
