# Hourly retry for Claude work paused by a usage limit.
# Carried forward from branch codex/ai-collaboration-setup. Changes:
#   - repo kill switch stops the retry loop;
#   - concurrency prevents overlapping manual/scheduled runs;
#   - retries are bounded per issue and fail closed after exhaustion.
# Pairs with the "Classify Claude result" step in claude.yml.
# See docs/ai/AI_COLLABORATION.md.
name: Retry Claude quota-paused work

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: claude-quota-retry
  cancel-in-progress: false

jobs:
  retry:
    if: vars.CLAUDE_AUTOMATION_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-trigger paused Claude tasks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAX_RETRIES: "6"
        shell: bash
        run: |
          set -euo pipefail
          numbers=$(gh api --method GET "repos/${REPOSITORY}/issues" \
            -f state=open -f labels='ai:paused-quota' -f per_page=10 \
            --jq '.[].number')

          for number in ${numbers}; do
            comments=$(gh api --paginate \
              "repos/${REPOSITORY}/issues/${number}/comments?per_page=100" \
              --jq '.[].body')

            attempts=$(printf '%s\n' "${comments}" | \
              grep -Fc '@claude Resume this task from the latest committed checkpoint' || true)

            if [ "${attempts}" -ge "${MAX_RETRIES}" ]; then
              if ! printf '%s\n' "${comments}" | grep -Fq '<!-- claude-quota-retry-exhausted -->'; then
                gh api --method POST "repos/${REPOSITORY}/issues/${number}/comments" \
                  -f body="<!-- claude-quota-retry-exhausted -->
AUTOMATION BLOCKED: Claude quota retry limit reached after ${attempts} automated resume attempts. The ai:paused-quota label is intentionally retained and no further automated retries will be sent until a human changes the issue state or removes the exhaustion marker."
              fi
              continue
            fi

            next_attempt=$((attempts + 1))
            gh api --method POST "repos/${REPOSITORY}/issues/${number}/comments" \
              -f body="<!-- claude-quota-retry-attempt:${next_attempt} -->
@claude Resume this task from the latest committed checkpoint and GitHub discussion. Do not repeat completed work. Continue until the next coherent checkpoint or READY_FOR_AUDIT."
            gh api --method DELETE \
              "repos/${REPOSITORY}/issues/${number}/labels/ai%3Apaused-quota" \
              >/dev/null 2>&1 || true
          done
