name: health-convergence-preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: health-convergence-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: health-convergence-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run deterministic Health convergence preflight
        run: node scripts/ci/health-convergence-preflight.mjs

      - name: Upload machine-readable preflight report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-convergence-preflight-${{ github.run_id }}
          path: artifacts/health-convergence-preflight.json
          if-no-files-found: error
          retention-days: 14
