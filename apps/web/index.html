<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5c7a5a" />
    <!-- PWA/Home Screen audit (6 Sep 2026) — iOS Safari ignores the web
         manifest for install/splash behaviour; it needs its own
         apple-* meta tags and a link rel="apple-touch-icon" or a home
         screen install falls back to a screenshot thumbnail instead of
         the brand mark, and reopening from the home screen loses the
         standalone status-bar styling. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Asclepios" />
    <title>Asclepios Sleep</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
